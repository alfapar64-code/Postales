<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creador de Postales</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="icono_postal.png">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 id="appTitle">Generador de Postales</h1>
    
    <div class="controls" id="mainControls">
      <label class="btn">
        🖼️ Galería
        <input type="file" id="imageInput" accept="image/*">
      </label>
      <button id="startCameraBtn" class="btn primary">📸 Cámara en vivo</button>
    </div>

    <div id="cameraControls" style="display:none; flex-direction: column; gap: 10px; width: 100%;">
      <div class="controls">
        <button id="switchCameraBtn" class="btn">🔄 Girar Cámara</button>
        <button id="captureBtn" class="btn primary">✅ Capturar</button>
      </div>
      <div id="zoomContainer" style="display:none; align-items: center; gap: 10px; background: #333; padding: 12px; border-radius: 8px; width: 100%;">
        <span>🔍 Zoom:</span>
        <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1" style="flex: 1;">
      </div>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
      <textarea id="quoteInput" rows="3" placeholder="Cargando mensaje..." style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: #333; color: white; font-size: 16px; resize: vertical; font-family: inherit;"></textarea>
      <button id="newQuoteBtn" class="btn" style="background: #444; font-size: 14px; padding: 10px;">🎲 Cargar otra frase al azar</button>
    </div>

    <div class="preview-container">
      <video id="liveVideo" autoplay playsinline style="display:none;"></video>
      <canvas id="postalCanvas" width="1080" height="1920"></canvas>
    </div>

    <button id="shareBtn" class="btn success" style="display:none;">📲 Compartir / Guardar</button>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function() {
        console.log('Service Worker Registrado');
      });
    }
  </script>
</body>
</html>
